<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPod Album Tag</title>
<style>
  :root {
    --bg: #96aed1;
    --screen: #ffffff;
    --text: #111111;
    --muted: #5a5a5a;
    --bar: linear-gradient(#6ba8f5, #216bdb);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #2a3446; --screen: #f2f2f2; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .screen {
    width: 100%;
    max-width: 360px;
    background: var(--screen);
    border: 8px solid #111;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  }
  .title {
    padding: 4px 10px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    background: linear-gradient(#fafafa, #c7c7c7);
    border-bottom: 1px solid #8c8c8c;
  }
  .row {
    padding: 6px 12px;
    font-weight: 700;
    color: #fff;
    background: var(--bar);
  }
  p { margin: 12px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
  <main class="screen">
    <div class="title">iPod</div>
    <div class="row">Album tag</div>
    <p>This tag plays an album in the iPod app. Hold it near an iPhone that has the app installed to start the music.</p>
  </main>
</body>
</html>
